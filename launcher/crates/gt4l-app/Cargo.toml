[package]
name = "gt4l-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GT4Recomp launcher application (Slint UI)"
build = "build.rs"

[features]
# Development only: GT4RECOMP_VISUAL_SCREEN / GT4RECOMP_VISUAL_PAGE pick the first page for screenshots.
visual-check = []

[[bin]]
name = "GT4Recomp"
path = "src/main.rs"

[dependencies]
gt4l-core.workspace = true
gt4l-disc.workspace = true
gt4saves.workspace = true
gt4controls.workspace = true
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Input_XboxController",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"
