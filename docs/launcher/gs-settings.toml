page = "advanced"
order = 18
control = "dropdown"
section = "EmuCore/GS"
key = "accurate_blending_unit"
type = "enum"
default = "high"
written = "always"
status = "ok"
choices = [
  { name = "minimum", ini = "0", status = "resolved" },
  { name = "basic", ini = "1", status = "resolved" },
  { name = "medium", ini = "2", status = "resolved" },
  { name = "high", ini = "3", status = "ok" },
  { name = "full", ini = "4", status = "resolved" },
  { name = "maximum", ini = "5", status = "resolved" },
]
notes = "AccBlendLevel (pcsx2/Config.h:330-337, Minimum = 0 to Maximum = 5). Loader pcsx2/Pcsx2Config.cpp:1054. PCSX2 default is Basic (pcsx2/Config.h:726); the owner keeps High (3). UI list pcsx2/ImGui/FullscreenUI_Settings.cpp:2881-2888. Full and Maximum are slow (UI text)."

