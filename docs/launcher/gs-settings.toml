# GT4Recomp GS settings table (TASK-039, curated by TASK-049, docs/GS-SETTINGS.md).
#
# One row per setting. Read by scripts/gs_settings.py (validation, gt4-gs.ini generation, allow-list, reset) and by
# the launcher (TASK-019/043). Key names and value numbers are interface facts from the PCSX2 v2.8.2 sources
# (tag v2.8.2 = commit fd9d310c). Each note cites file:line at that commit. No code is copied; only names and numbers.
#
# Columns:
#   id          launcher identifier (lowercase; play_performance.py --gs-setting ID=VALUE uses it)
#   label       name shown to the owner
#   help        one-line help text
#   page        basic (the launcher's GRAPHICS page), advanced (ADVANCED page), mods (a future mod manager, TASK-048;
#               shown on neither page), hidden (never shown: launcher or GT4 internal)
#   order       position within the page (1 is first); unique per page
#   control     slider (int range), toggle (bool), dropdown (enum), text (string), none (launcher-supplied, path)
#   section     INI section (empty for launcher-only rows)
#   key         INI key (empty for launcher-only rows, or when one row stands for several keys)
#   type        bool, int, float, enum, string, path (path = folder supplied by the launcher)
#   min, max    range for int and float
#   choices     enum values: { name = launcher name, ini = INI value, status = ok | resolved | pending-TASK-NNN,
#               label = optional display text }
#   default     GT4 default (launcher name for enums, "true" or "false" for bool, "" for an empty string)
#   written     always (in every generated INI), when-set (only when the value differs from the default),
#               launcher (only when the launcher supplies it), never (launcher-only, not in the INI)
#   status      ok        settable: key and values confirmed in the sources, and the owner accepts the row
#               resolved  key and values confirmed in the PCSX2 v2.8.2 sources; not settable until the owner
#                         checks it in the game (then it becomes ok)
#               pending-TASK-0NN  depends on another task
#   env         launcher-only rows: the environment variable the launcher reads
#   notes       sources and open points
#
# Rule: a value is settable only when its row and its choice have status ok. Anything else is refused.
# The allow-list (gs-settings-allowlist.json) lists every row with a section and key, whatever its status.
# [[profile]] gt4-defaults: Reset to defaults = the default of every settable row (scripts/gs_settings.py
# reset_to_defaults()). render_ini(reset) reproduces the default gt4-gs.ini byte for byte.

schema_version = 1

[[profile]]
name = "gt4-defaults"
description = "Reset to defaults: GT4 default for every settable row (owner decisions, 2026-10-16)."

[[setting]]
id = "gs_engine"
label = "Renderer"
help = "Which renderer draws the game: the PCSX2 GS (default) or CoreGS 1.1 (secondary)."
page = "basic"
order = 1
control = "dropdown"
section = ""
key = ""
type = "enum"
default = "pcsx2"
written = "never"
status = "ok"
env = "GT4_GS_ENGINE"
choices = [
  { name = "pcsx2", ini = "", status = "ok", label = "PCSX2 GS" },
  { name = "coregs-1.1", ini = "", status = "ok", label = "CoreGS 1.1 (secondary)" },
]
notes = "Owner decision 2026-10-16 (TASK-049, item 1). Launcher-only: pcsx2 = gt4-gs.exe (`--mode pcsx2`); coregs-1.1 = the built-in CoreGS 1.1 fallback (`--mode main`). Its upscale, FSR, FXAA and deinterlace options are hidden (owner decision 5). The launcher reads GT4_GS_ENGINE (TASK-019/043); it is never written to gt4-gs.ini."

[[setting]]
id = "renderer"
label = "Graphics API (PCSX2 GS)"
help = "Graphics API for the PCSX2 GS. Vulkan is the GT4 renderer; D3D12 and D3D11 show after the owner checks them."
page = "advanced"
order = 1
control = "dropdown"
section = "EmuCore/GS"
key = "Renderer"
type = "enum"
default = "vulkan"
written = "always"
status = "ok"
choices = [
  { name = "vulkan", ini = "14", status = "ok" },
  { name = "d3d12", ini = "15", status = "resolved" },
  { name = "d3d11", ini = "3", status = "resolved" },
]
notes = "GSRendererType (pcsx2/Config.h:271-281): VK = 14, DX12 = 15, DX11 = 3. Loader pcsx2/Pcsx2Config.cpp:1044 (key Renderer). UI values pcsx2/ImGui/FullscreenUI_Settings.cpp:2774-2790. D3D11 and D3D12 are resolved but not offered: the GT4 build is checked on Vulkan only."

[[setting]]
id = "upscale"
label = "Internal resolution"
help = "GS internal resolution, 1x to 12x. The launcher clamps it to the GPU limit (see notes)."
page = "basic"
order = 2
control = "slider"
section = "EmuCore/GS"
key = "upscale_multiplier"
type = "int"
min = 1
max = 12
default = "3"
written = "always"
status = "ok"
notes = "D.1 range, widened by owner decision 6 (2026-10-16). The loader accepts 1 to 12 (pcsx2/Pcsx2Config.cpp:1045). PCSX2 clamps any value above GSGetMaxUpscaleMultiplier = max(max texture size / 1280, 1) (pcsx2/GS/GS.cpp:677-681) with an OSD warning (pcsx2/GS/GS.cpp:225-240). A 16384-texel GPU allows 12x; 8192 allows 6x. READY carries no max-upscale field: ReadyPayload (3rdparty/gt4recomp-gs-stream/gs_stream_protocol.h:177-187) has only a reserved u32. Until gt4-gs reports the limit, the launcher offers 1 to 12 and PCSX2 clamps. ExtendedUpscalingMultipliers is NOT required up to 12x (see extended_upscale). --gs-scale N sets this row (GT4_GS_SCALE)."

