# GT4Recomp GS settings table (TASK-039, docs/GS-SETTINGS.md).
#
# One row per setting. Read by scripts/gs_settings.py (validation, gt4-gs.ini generation, allow-list) and, later, by
# the launcher (TASK-019/043). Key names and value numbers are interface facts from the PCSX2 v2.8.2 sources
# (commit fd9d310c). Each note cites file:line at that commit. No code is copied; only names and numbers.
#
# Columns:
#   id          launcher identifier (lowercase; play_performance.py --gs-setting ID=VALUE uses it)
#   label       name shown to the owner
#   help        one-line help text
#   page        Graphics, Display or Advanced
#   section     INI section (empty for launcher-only rows)
#   key         INI key (empty for launcher-only rows, or when one row stands for several keys)
#   type        bool, int, float, enum, string, path (path = folder supplied by the launcher)
#   min, max    range for int and float
#   choices     enum values: { name = launcher name, ini = INI value, status = ok | resolved | pending-TASK-0NN }
#   default     GT4 default (launcher name for enums, "true" or "false" for bool, "" for an empty string)
#   visibility  basic, advanced or hidden (the launcher offers only basic and advanced rows with status ok)
#   written     always (in every generated INI), when-set (only when a user sets it), launcher (only when the
#               launcher supplies it), never (launcher-only, not in the INI)
#   status      ok        settable: key and values confirmed in the sources, and the owner accepts the row
#               resolved  key and values confirmed in the PCSX2 v2.8.2 sources; not settable until the owner
#                         checks it in the game (then it becomes ok)
#               pending-TASK-0NN  depends on another task (a value, a reader or a launcher decision waits for it)
#   env         launcher-only rows: the environment variable the game reads
#   notes       sources and open points
#
# Rule: a value is settable only when its row and its choice have status ok. Anything else is refused.
# The allow-list (gs-settings-allowlist.json) lists every row with a section and key, whatever its status.

schema_version = 1

[[setting]]
id = "renderer"
label = "Renderer API"
help = "Graphics API for the PCSX2 GS. Vulkan is the release renderer."
page = "Graphics"
section = "EmuCore/GS"
key = "Renderer"
type = "enum"
default = "vulkan"
visibility = "basic"
written = "always"
status = "ok"
choices = [
  { name = "vulkan", ini = "14", status = "ok" },
  { name = "d3d12", ini = "15", status = "resolved" },
  { name = "d3d11", ini = "3", status = "resolved" },
]
notes = "GSRendererType (pcsx2/Config.h:271-281): VK = 14, DX12 = 15, DX11 = 3. Loader pcsx2/Pcsx2Config.cpp:1044 (key Renderer). UI values pcsx2/ImGui/FullscreenUI_Settings.cpp:2774-2790. D3D11 and D3D12 are resolved but not offered: the GT4 build is checked on Vulkan only."

[[setting]]
id = "upscale"
label = "Internal resolution"
help = "GS internal resolution multiplier (1x to 8x). Default 3x."
page = "Graphics"
section = "EmuCore/GS"
key = "upscale_multiplier"
type = "int"
min = 1
max = 8
default = "3"
visibility = "basic"
written = "always"
status = "ok"
notes = "D.1: 1x-8x. The PCSX2 UI lists up to 25x (pcsx2/ImGui/FullscreenUI_Settings.cpp:2809-2861); above 8 needs ExtendedUpscalingMultipliers (not in the table). Loader pcsx2/Pcsx2Config.cpp:1045. --gs-scale N sets this row (GT4_GS_SCALE)."

