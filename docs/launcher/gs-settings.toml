# GT4Recomp GS settings table (TASK-039, docs/GS-SETTINGS.md).
#
# One row per setting. Read by scripts/gs_settings.py (validation, gt4-gs.ini generation, allow-list) and, later, by
# the launcher (TASK-019/043). Option names and PCSX2 keys are interface facts from docs/GSDX-PLAN.md section D.1/D.2.
#
# Columns:
#   id          launcher identifier (lowercase; play_performance.py --gs-setting ID=VALUE uses it)
#   label       name shown to the owner
#   help        one-line help text
#   page        Graphics, Display or Advanced
#   section     INI section (empty for launcher-only rows)
#   key         INI key (empty for launcher-only rows, or when the key name is not known yet)
#   type        bool, int, float, enum, string, path (path = folder supplied by the launcher)
#   min, max    range for int and float
#   choices     enum values: { name = launcher name, ini = INI value, status = ok | TBD-fork | pending-TASK-0NN }
#   default     GT4 default (launcher name for enums, "true" or "false" for bool)
#   visibility  basic, advanced or hidden (the launcher offers only basic and advanced rows with status ok)
#   written     always (in every generated INI), when-set (only when a user sets it), launcher (only when the
#               launcher supplies it), never (launcher-only, not in the INI)
#   status      ok (settable), TBD-fork (value or key name not in the plan; not settable),
#               pending-TASK-0NN (depends on another task; not settable yet)
#   env         launcher-only rows: the environment variable the game reads
#   notes       sources and open points
#
# Rule: a value is settable only when its row and its choice have status ok. Anything else is refused.

schema_version = 1

[[setting]]
id = "renderer"
label = "Renderer API"
help = "Graphics API for the PCSX2 GS. Vulkan is the release renderer."
page = "Graphics"
section = "EmuCore/GS"
key = "Renderer"
type = "enum"
default = "vulkan"
visibility = "basic"
written = "always"
status = "ok"
choices = [
  { name = "vulkan", ini = "14", status = "ok" },
  { name = "d3d12", ini = "", status = "TBD-fork" },
  { name = "d3d11", ini = "", status = "TBD-fork" },
]
notes = "Vulkan = 14 (value already used by TASK-036). D3D12 and D3D11 integers are not in the plan: TBD-fork, not offered."

[[setting]]
id = "upscale"
label = "Internal resolution"
